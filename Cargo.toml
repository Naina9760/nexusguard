[package]
name = "nexusguard"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
authors = ["Naina Rathore"]
description = "A runtime monitor that watches an LLM inference server's Prometheus metrics for stalls, thrashing and backlog using bounded past-time temporal rules."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Naina9760/nexusguard"
readme = "README.md"
keywords = ["llm", "vllm", "runtime-verification", "monitoring", "prometheus"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "nexusguard"
path = "src/lib.rs"

[[bin]]
name = "nexusguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[dev-dependencies]
proptest = "1"
