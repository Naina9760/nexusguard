<svg class="ng" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="w-t w-d">
<title id="w-t">How a rule reaches true, false or unknown</title>
<desc id="w-d">Three examples of the rule "always for 30 seconds, requests are waiting and no tokens are produced". When monitoring started less than 30 seconds ago and every sample matches, the verdict is unknown. When the window is covered and every sample matches, it is true. One non-matching sample inside the window makes it false at once, even if the window is not yet covered.</desc>
<style>
svg.ng{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--panel:#f6f8fa;--accent:#0969da;--crit:#cf222e;--ok:#1a7f37;--unk:#8c959f}
@media (prefers-color-scheme:dark){svg.ng{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--grid:#30363d;--panel:#151b23;--accent:#58a6ff;--crit:#ff7b72;--ok:#3fb950;--unk:#6e7681}}
svg.ng .bg{fill:var(--bg)}
svg.ng text{font:12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
svg.ng .h{font-size:14px;font-weight:600}
svg.ng .m{fill:var(--muted);font-size:11px}
svg.ng .row{font-weight:600}
svg.ng .axis{stroke:var(--grid);stroke-width:1.5}
svg.ng .win{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:1.4}
svg.ng .nodata{fill:url(#w-unk);stroke:var(--unk);stroke-width:1;stroke-dasharray:3 3}
svg.ng .on{fill:var(--crit)}
svg.ng .off{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
svg.ng .now{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:3 3}
svg.ng .chip{stroke-width:1.5;fill:var(--panel)}
svg.ng .chip-unk{stroke:var(--unk)}
svg.ng .chip-true{stroke:var(--crit)}
svg.ng .chip-false{stroke:var(--ok)}
svg.ng .v-unk{font-weight:700;fill:var(--muted)}
svg.ng .v-true{font-weight:700;fill:var(--crit)}
svg.ng .v-false{font-weight:700;fill:var(--ok)}
svg.ng .unk-bg{fill:var(--panel)}
svg.ng .unk-line{stroke:var(--unk);stroke-width:1.5}
</style>
<defs><pattern id="w-unk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="unk-bg"/><line x1="0" y1="0" x2="0" y2="6" class="unk-line"/></pattern></defs>
<rect class="bg" width="900" height="400"/>

<text class="h" x="24" y="30">Rule: always for 30 s, requests are waiting and no tokens are produced</text>
<text class="m" x="24" y="48">Each dot is one scrape, 2 s apart. The blue band is the 30 s window ending at the latest scrape (dashed line).</text>

<!-- Row 1: attached 20 s ago, every sample matches -->
<text class="row" x="24" y="100">Just attached</text>
<text class="m" x="24" y="116">watching for 20 s</text>
<rect class="nodata" x="150" y="84" width="80" height="34"/>
<text class="m" x="190" y="78" text-anchor="middle">before monitoring</text>
<rect class="win" x="150" y="84" width="240" height="34" rx="4"/>
<line class="axis" x1="230" y1="101" x2="560" y2="101"/>
<circle class="on" cx="230" cy="101" r="4.5"/><circle class="on" cx="246" cy="101" r="4.5"/><circle class="on" cx="262" cy="101" r="4.5"/><circle class="on" cx="278" cy="101" r="4.5"/><circle class="on" cx="294" cy="101" r="4.5"/><circle class="on" cx="310" cy="101" r="4.5"/><circle class="on" cx="326" cy="101" r="4.5"/><circle class="on" cx="342" cy="101" r="4.5"/><circle class="on" cx="358" cy="101" r="4.5"/><circle class="on" cx="374" cy="101" r="4.5"/><circle class="on" cx="390" cy="101" r="4.5"/>
<line class="now" x1="390" y1="76" x2="390" y2="126"/>
<rect class="chip chip-unk" x="640" y="84" width="236" height="34" rx="17"/>
<text class="v-unk" x="658" y="105">unknown</text>
<text class="m" x="730" y="105">window not full yet</text>

<!-- Row 2: watched 40 s, every sample matches -->
<text class="row" x="24" y="200">Watched 40 s</text>
<text class="m" x="24" y="216">window is full</text>
<rect class="win" x="230" y="184" width="240" height="34" rx="4"/>
<line class="axis" x1="150" y1="201" x2="560" y2="201"/>
<circle class="on" cx="150" cy="201" r="4.5"/><circle class="on" cx="166" cy="201" r="4.5"/><circle class="on" cx="182" cy="201" r="4.5"/><circle class="on" cx="198" cy="201" r="4.5"/><circle class="on" cx="214" cy="201" r="4.5"/><circle class="on" cx="230" cy="201" r="4.5"/><circle class="on" cx="246" cy="201" r="4.5"/><circle class="on" cx="262" cy="201" r="4.5"/><circle class="on" cx="278" cy="201" r="4.5"/><circle class="on" cx="294" cy="201" r="4.5"/><circle class="on" cx="310" cy="201" r="4.5"/><circle class="on" cx="326" cy="201" r="4.5"/><circle class="on" cx="342" cy="201" r="4.5"/><circle class="on" cx="358" cy="201" r="4.5"/><circle class="on" cx="374" cy="201" r="4.5"/><circle class="on" cx="390" cy="201" r="4.5"/><circle class="on" cx="406" cy="201" r="4.5"/><circle class="on" cx="422" cy="201" r="4.5"/><circle class="on" cx="438" cy="201" r="4.5"/><circle class="on" cx="454" cy="201" r="4.5"/><circle class="on" cx="470" cy="201" r="4.5"/>
<line class="now" x1="470" y1="176" x2="470" y2="226"/>
<rect class="chip chip-true" x="640" y="184" width="236" height="34" rx="17"/>
<text class="v-true" x="658" y="205">true</text>
<text class="m" x="700" y="205">alarm fires</text>

<!-- Row 3: one sample does not match, window not full -->
<text class="row" x="24" y="300">One mismatch</text>
<text class="m" x="24" y="316">watching for 20 s</text>
<rect class="nodata" x="150" y="284" width="80" height="34"/>
<rect class="win" x="150" y="284" width="240" height="34" rx="4"/>
<line class="axis" x1="230" y1="301" x2="560" y2="301"/>
<circle class="on" cx="230" cy="301" r="4.5"/><circle class="on" cx="246" cy="301" r="4.5"/><circle class="on" cx="262" cy="301" r="4.5"/><circle class="off" cx="278" cy="301" r="4.5"/><circle class="on" cx="294" cy="301" r="4.5"/><circle class="on" cx="310" cy="301" r="4.5"/><circle class="on" cx="326" cy="301" r="4.5"/><circle class="on" cx="342" cy="301" r="4.5"/><circle class="on" cx="358" cy="301" r="4.5"/><circle class="on" cx="374" cy="301" r="4.5"/><circle class="on" cx="390" cy="301" r="4.5"/>
<line class="now" x1="390" y1="276" x2="390" y2="326"/>
<rect class="chip chip-false" x="640" y="284" width="236" height="34" rx="17"/>
<text class="v-false" x="658" y="305">false</text>
<text class="m" x="706" y="305">known at once</text>

<circle class="on" cx="34" cy="364" r="4.5"/>
<text class="m" x="46" y="368">scrape where requests are waiting and no tokens were produced</text>
<circle class="off" cx="400" cy="364" r="4.5"/>
<text class="m" x="412" y="368">scrape where that was not true</text>
<text class="m" x="24" y="392">A counterexample settles "always" at once. Missing history does not.</text>
</svg>
