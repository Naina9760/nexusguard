<svg class="ng" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="a-t a-d">
<title id="a-t">NexusGuard data flow</title>
<desc id="a-d">A server's metrics page is parsed into samples, kept in a bounded trace with derived rates, evaluated by a three-valued temporal rule engine, and turned into edge-triggered events that go to stdout, an optional webhook or program, and a web page with a verdict timeline. Recorded traces enter at the sample stage.</desc>
<style>
svg.ng{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--panel:#f6f8fa;--accent:#0969da}
@media (prefers-color-scheme:dark){svg.ng{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--grid:#30363d;--panel:#151b23;--accent:#58a6ff}}
svg.ng .bg{fill:var(--bg)}
svg.ng text{font:12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
svg.ng .t{font-size:13.5px;font-weight:600}
svg.ng .s{font-size:11px;fill:var(--muted)}
svg.ng .box{fill:var(--panel);stroke:var(--grid);stroke-width:1.2}
svg.ng .key{fill:var(--panel);stroke:var(--accent);stroke-width:2}
svg.ng .proc{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
svg.ng .arrow{fill:none;stroke:var(--muted);stroke-width:1.6}
svg.ng .head{fill:var(--muted)}
</style>
<defs><marker id="a-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect class="bg" width="1000" height="400"/>

<rect class="proc" x="196" y="34" width="778" height="150" rx="10"/>
<text class="s" x="210" y="54">the nexusguard process</text>

<rect class="box" x="20" y="76" width="130" height="80" rx="8"/>
<text class="t" x="85" y="110" text-anchor="middle">Inference server</text>
<text class="s" x="85" y="128" text-anchor="middle">/metrics page</text>

<rect class="box" x="220" y="76" width="120" height="80" rx="8"/>
<text class="t" x="280" y="104" text-anchor="middle">Parse</text>
<text class="s" x="280" y="122" text-anchor="middle">prom.rs</text>
<text class="s" x="280" y="138" text-anchor="middle">page to Sample</text>

<rect class="box" x="410" y="76" width="120" height="80" rx="8"/>
<text class="t" x="470" y="104" text-anchor="middle">Trace</text>
<text class="s" x="470" y="122" text-anchor="middle">trace.rs</text>
<text class="s" x="470" y="138" text-anchor="middle">history and rates</text>

<rect class="key" x="600" y="76" width="120" height="80" rx="8"/>
<text class="t" x="660" y="104" text-anchor="middle">Rule engine</text>
<text class="s" x="660" y="122" text-anchor="middle">formula.rs · rules.rs</text>
<text class="s" x="660" y="138" text-anchor="middle">true / false / unknown</text>

<rect class="box" x="790" y="76" width="160" height="80" rx="8"/>
<text class="t" x="870" y="104" text-anchor="middle">Monitor</text>
<text class="s" x="870" y="122" text-anchor="middle">monitor.rs</text>
<text class="s" x="870" y="138" text-anchor="middle">one event per change</text>

<path class="arrow" marker-end="url(#a-h)" d="M150 116 H218"/>
<path class="arrow" marker-end="url(#a-h)" d="M340 116 H408"/>
<path class="arrow" marker-end="url(#a-h)" d="M530 116 H598"/>
<path class="arrow" marker-end="url(#a-h)" d="M720 116 H788"/>
<text class="s" x="375" y="108" text-anchor="middle">Sample</text>
<text class="s" x="565" y="108" text-anchor="middle">+ rates</text>
<text class="s" x="754" y="108" text-anchor="middle">verdicts</text>


<rect class="box" x="20" y="262" width="130" height="72" rx="8"/>
<text class="t" x="85" y="292" text-anchor="middle">Recorded trace</text>
<text class="s" x="85" y="311" text-anchor="middle">JSON lines</text>
<path class="arrow" marker-end="url(#a-h)" d="M150 298 H470 V158"/>
<text class="s" x="300" y="290" text-anchor="middle">replay · render · CI</text>

<path class="arrow" d="M870 156 V206"/>
<path class="arrow" d="M620 206 H900"/>
<path class="arrow" marker-end="url(#a-h)" d="M620 206 V258"/>
<path class="arrow" marker-end="url(#a-h)" d="M760 206 V258"/>
<path class="arrow" marker-end="url(#a-h)" d="M900 206 V258"/>

<rect class="box" x="560" y="262" width="120" height="72" rx="8"/>
<text class="t" x="620" y="292" text-anchor="middle">stdout</text>
<text class="s" x="620" y="311" text-anchor="middle">JSON events</text>

<rect class="box" x="700" y="262" width="120" height="72" rx="8" stroke-dasharray="5 4"/>
<text class="t" x="760" y="292" text-anchor="middle">Webhook / exec</text>
<text class="s" x="760" y="311" text-anchor="middle">opt-in</text>

<rect class="box" x="840" y="262" width="120" height="72" rx="8"/>
<text class="t" x="900" y="292" text-anchor="middle">Web UI · SVG</text>
<text class="s" x="900" y="311" text-anchor="middle">verdict timeline</text>

<text class="s" x="560" y="362">Nothing leaves the machine unless --webhook or --exec is given.</text>
</svg>
